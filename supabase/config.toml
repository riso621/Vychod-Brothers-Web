[auth]
site_url = "https://vychodbrothersclub.sk"
additional_redirect_urls = [
  "https://vychodbrothersclub.sk/auth/callback",
  "https://vychodbrothersclub.sk/reset-hesla",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/reset-hesla",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/reset-hesla",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false

[functions.cloudflare-stream-upload-url]
verify_jwt = false

[functions.cloudflare-stream-playback-token]
verify_jwt = false

[functions.cloudflare-stream-delete-video]
verify_jwt = false

[functions.admin-memberships]
verify_jwt = false

[functions.youtube-latest-video]
verify_jwt = false

[functions.social-stats-sync]
verify_jwt = false

[functions.stripe-create-checkout]
verify_jwt = false

[functions.stripe-customer-portal]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.admin-control-center]
verify_jwt = false

[functions.club-email-dispatch]
verify_jwt = false

[functions.club-email-thumbnail]
verify_jwt = false

[functions.club-email-assets]
verify_jwt = false
static_files = ["./functions/club-email-assets/*.jpg", "./functions/club-email-assets/*.png"]
